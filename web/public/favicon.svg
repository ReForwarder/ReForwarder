  <g fill="none" stroke="#ff801f" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 20 L28 32 L17 44"/>
    <path d="M31 20 L42 32 L31 44"/>
  </g>
  <circle cx="47" cy="32" r="3.2" fill="#fcfdff"/>
</svg>
